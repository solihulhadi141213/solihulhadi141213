<desc id="desc">Based in Kuningan, West Java. Programmer, SIRS Division, RSU El-Syifa Kuningan. Bachelor’s degree in Forestry, Universitas Kuningan. Born in Bandung, May 13, 1988. Email dhiforester@gmail.com.</desc>
